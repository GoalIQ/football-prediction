# X-viikkoketju (19.10.2026, ylläpitäjän päätös "go 1-5", kohta 4): kun kierros on FPL:ssä lopullinen,
# ylläpitäjälle tulee issue (label x-jono -> Gmail), jossa on valmis ketju mallin oman joukkueen
# (entry 116920) luvuista. Ylläpitäjä postaa itse: X:n API on maksullinen ja automaatiosäännöt kieltävät
# skriptatun postauksen. Ei Claudea, ei salaisuuksia: luvut FPL:n julkisesta rajapinnasta, pohjat
# julkaisutarkistajan korjaamat (19.10) sellaisenaan (scripts/x_viikkoketju.py). Bluesky-botin oma
# kierroskatsaus (topic recap) ei mene X-jonoon, ettei samasta kierroksesta tule kahta.
#
# Idempotentti: sama kierros ei saa toista issueta (otsikko haetaan myös suljetuista), joten rele ja
# myöhässä tuleva cron eivät tuplaa (scripts/fp_dispatch_relay.py TARGETS).

name: x-viikkoketju

on:
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch: {}

concurrency:
  group: x-viikkoketju
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  ketju:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: X-ketju ylläpitäjälle (vain uusi lopullinen kierros)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.x_viikkoketju
