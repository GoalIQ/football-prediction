# Uudet tilit MailerLiten tervetuloryhmään (18.10.2026, Villen päätös: tervetuloviesti, ei viikkoblastia).
#
# Mitattu ennen päätöstä: GW5-deadlineviesti 18.9 koko listalle, 125 vastaanottajaa, avattu 7,2 %,
# klikkejä 0. Siksi viesti lähtee kerran, kun tili on tuore: MailerLiten oma automaatio laukeaa, kun
# tilaaja liittyy ryhmään "GoalIQ users". Tämä työnkulku vain lisää uudet tilit ryhmään.
#
# Render tekee haun (Supabase-avain pysyy Renderissä, kuten /api/admin/conversion); CI lähettää
# ADMIN_TOKENin ja MailerLiten avaimen otsakkeessa. Lokiin ei tulosteta osoitteita eikä määriä
# (julkinen repo): vain tila. Punainen, kun haku epäonnistuu TAI ilmaispaketin katto (250) estää
# uuden tilin lisäyksen, jotta uusi tili ei jää hiljaa ilman viestiä.
# 0 euroa: ei Claudea, MailerLite Free, julkinen repo.

name: tervetulo-synkka

on:
  workflow_dispatch: {}
  schedule:
    - cron: '43 */6 * * *'

concurrency:
  group: tervetulo-synkka
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  synkka:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Avaimet asetettu
        env:
          A: ${{ secrets.ADMIN_TOKEN }}
          M: ${{ secrets.MAILERLITE_API_TOKEN }}
        run: |
          if [ -z "$A" ]; then echo "::error::ADMIN_TOKEN puuttuu"; exit 1; fi
          if [ -z "$M" ]; then
            echo "::error::MAILERLITE_API_TOKEN puuttuu. Ville: MailerLite > Integrations > API > Generate new token, sitten gh secret set MAILERLITE_API_TOKEN -R GoalIQ/football-prediction"
            exit 1
          fi

      - name: Synkkaa uudet tilit
        env:
          A: ${{ secrets.ADMIN_TOKEN }}
          M: ${{ secrets.MAILERLITE_API_TOKEN }}
        run: |
          set -e
          koodi=$(curl -sS -o "$RUNNER_TEMP/v.json" -w '%{http_code}' --max-time 300 -X POST \
            -H "X-Admin-Token: $A" -H "X-MailerLite-Token: $M" \
            "https://goaliq-api.onrender.com/api/admin/mailerlite-sync?paivia=14")
          python3 - "$RUNNER_TEMP/v.json" "$koodi" <<'PY'
          import json, sys
          polku, koodi = sys.argv[1], sys.argv[2]
          if koodi != "200":
              print(f"::error::synkka HTTP {koodi}")
              sys.exit(1)
          v = json.load(open(polku))
          tila = v.get("tila")
          lisatty = "kyllä" if v.get("lisatty") else "ei"
          print(f"tila={tila}, uusia lisättiin: {lisatty}, virheitä: {v.get('virheita')}")
          if tila == "katto":
              print("::error::MailerLiten ilmaispaketin katto (250) estää uusien tilien lisäyksen: "
                    "siivoa inaktiiviset tilaajat (Subscribers > Clean up inactive) tai päätä muusta.")
              sys.exit(1)
          if v.get("tilaa_jaljella", 99) < 20:
              print("::warning::MailerLiten katto lähellä (alle 20 paikkaa)")
          sys.exit(0 if tila == "ok" else 1)
          PY
