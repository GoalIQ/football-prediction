# UCL Fantasy -syotteen ingestio (Villen paatos 7.9.2026: "laajin
# mahdollinen, anna menna vaan").
#
# 0 EUROA: julkinen syote, ei avaimia, ei krediitteja. Eraajo, ei
# serve-ajan fan-outia.
#
# 🔴 KADENSSI ON SIDOTTU DEADLINEEN, EI KELLONAIKAAN. UCL:n liigavaihe on
# 8 kierrosta kolmen kuukauden aikana (MD1 8.9.2026, MD8 27.1.2027), eli
# valissa on 5 viikon taukoja. Tunneittain ajaminen olisi kuormaa ilman
# hyotya; kerran 6 h riittaa hintamuutoksiin ja kokoonpanotietoihin, ja
# deadline-paivina se on tarpeeksi tihea.
name: ucl-refresh
on:
  schedule:
    - cron: "20 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  # Sivut deployataan hub-deploylla; sama oikeus kuin muilla
  # itsekorjaavilla ajoilla (7.9: tama puuttui `fpl-data-refresh`ilta ja
  # itsekorjaus ei voinut korjata mitaan kertaakaan).
  actions: write

concurrency:
  group: ucl-refresh
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # 🔴 9.9: TAMA ASKEL PUUTTUI, JA WORKFLOW EPAONNISTUI 3/3 AJOSSA
      # luomisestaan (7.9 21:32) lahtien: `build_ucl_page` -> `build_fpl_longtail`
      # -> `build_fpl_page` -> `build_fpl_phase0` -> `import numpy`.
      # `ingest_ucl` on stdlib-only ja ONNISTUI joka kerta, eli tuore syote
      # kirjoitettiin levylle kolmesti ja committiin nolla kertaa.
      #
      # Tama on KOLMAS kerta samalle vialle: 9.8 (`f6418b8e`) sama importti
      # tuli `build_fpl_page`iin ja kaatoi `fpl-page-refresh`in 8 vuorokaudeksi;
      # korjaus 17.8 kirjoitettiin YHTEEN tiedostoon kasin kopioituna listana,
      # eika mikaan estanyt uutta workflow'ta unohtamasta sita. Portti on nyt
      # `tests/test_workflow_deps.py`, joka johtaa riippuvuudet entry pointin
      # AST:sta - unohdus kaataa testin, ei vasta cronin.
      #
      # Asennus on tests.yml:n resepti (`-r requirements.txt`) eika
      # fpl-page-refreshin minimisetti: gate-askel ajaa pytestin, ja
      # `tests/conftest.py` importtaa `api.main`in JOKAISESSA testissa ->
      # minimisetti kaatuisi `fastapi`an ennen kuin ehtii numpyyn.
      # Yksi asennus ennen kaikkea muuta: build ja gate jakavat saman
      # ympariston eivatka voi ajautua erilleen.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx

      - name: Ingest UCL Fantasy feed
        run: |
          python -m scripts.ingest_ucl || {
            echo "::error::ucl-ingestio kaatui - artefaktia EI paivitetty"
            exit 1
          }

      - name: Build /ucl pages
        run: |
          # 🔴 SIVU JA DATA SAMASSA AJOSSA. Erillinen sivu-workflow ajautuu
          # datan alle ja sivu jaatyy tuoreen artefaktin paalle, ilman etta
          # kumpikaan ajo on punainen (muisti: sivu-ja-data-eri-workflowssa).
          python -m scripts.build_ucl_page || {
            echo "::error::ucl-sivugeneraattori kaatui"
            exit 1
          }

      - name: Bake UEFA joint model (kylmafitin 211 s pois APIsta)
        env:
          # 9.9: ilman avainta kotiliigat latautuvat tyhjina ja malli on
          # pelkka turnausjoukko (36 seuraa, 0 kalibroitunutta liigaa).
          # Bake kieltaytyy kirjoittamasta sellaista, mutta avain on se
          # jolla ajo ONNISTUU eika vain epaonnistu oikein.
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          # 9.9: API lataa data/uefa_joint_model.json:n millisekunneissa ja
          # fittaa livena vain jos artefakti puuttuu tai on yli 26 h vanha.
          # Epaonnistuminen EI kaada ajoa: silloin API fittaa itse (hidas
          # mutta oikea), ja varoitus nakyy ajolokissa.
          python -m scripts.build_uefa_model || \
            echo "::warning::UEFA-mallin bake epaonnistui - API fittaa livena kunnes seuraava ajo onnistuu"

      - name: Gate — artefakti on kuluvalta kaudelta, sivut sopimuksen mukaisia
        run: |
          python -m pytest tests/test_ingest_ucl.py tests/test_ucl_phase.py \
                           tests/test_ucl_page.py tests/test_svg_charts.py \
                           tests/test_page_contract.py -q || {
            echo "::error::UCL-portti punainen - mitaan ei committoida"
            exit 1
          }

      - name: Commit + push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 🔴 Jokainen kirjoitettu artefakti on oltava tassa listassa.
          # `data/gw_recap.json` oli JAASSA 7 vrk siksi etta builderi ajoi
          # joka kerta mutta `git add` ei sisaltanyt sen ulostuloa, eika
          # askel kaatunut kertaakaan.
          [ -f data/ucl_fantasy.json ] && git add data/ucl_fantasy.json
          [ -f ucl/index.html ] && git add ucl/index.html
          [ -f ucl/prices.html ] && git add ucl/prices.html
          [ -f ucl/team-news.html ] && git add ucl/team-news.html
          # 7.9: builderi kirjoittaa myos naihin (sitemapin UCL-lastmod ja
          # llms.txt:n GEN:UCL-lohko). Ilman naita rivia upsert ajaisi joka
          # kerta levylle eika paatyisi koskaan committiin: sivu vaihtuisi,
          # `lastmod` jaisi 7.9.2026:een ja llms.txt lupaisi vanhoja lukuja.
          [ -f sitemap-core.xml ] && git add sitemap-core.xml
          [ -f llms.txt ] && git add llms.txt
          [ -f data/uefa_joint_model.json ] && git add data/uefa_joint_model.json
          if git diff --cached --quiet; then
            echo "Ei muutoksia."
            exit 0
          fi
          # 9.9: [skip ci] ON tassa, ja se ei ole se joka esti deployn.
          # GITHUB_TOKENilla tehty push EI KOSKAAN kaynnista workflow'ta,
          # lipusta riippumatta - se on GitHubin rekursiosuoja. Ensimmainen
          # onnistunut ajo (9.9 04:47, commit 91c0382d2) todisti sen: kolme
          # UCL-sivua committiin, nolla check-runia, goaliq.app/ucl servasi
          # edellista committia (md5 mitattu). Ainoa polku sivulle on
          # hub-deployn dispatch alla, ja [skip ci] kertoo S10-signaalille
          # etta rakentamattomuus on tarkoitettu (muisti:
          # skip-ci-proosassa-sammuttaa-koko-pushin koskee IHMISEN pushia).
          git commit -m "chore(ucl): fantasy feed refresh [skip ci]"
          git pull --rebase --autostash -q origin main || true
          git push origin main

      # 9.9: DEPLOY EI RIIPU SIITA KUKA PUSHASI VAAN SIITA MITA LIVE SERVAA.
      # Sama askel kuin accuracy-log/fpl-data-refresh/fpl-page-refresh:
      # mittaa goaliq.app/ucl/* vs repo, dispatchaa hub-deployn jos eroaa,
      # ja vahvistaa lopputilan. tests/test_workflow_deploy_verify.py vaatii
      # taman jokaiselta workflow'lta joka lisaa servattavan sivun.
      - name: Deploy-verify — live servaa repon UCL-sivut (+ itsekorjaus)
        id: hubdispatch
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/verify_live_pages.sh ucl/index.html ucl/prices.html ucl/team-news.html

      - name: Deploy health (fail loud, data jo committoitu)
        if: always()
        run: |
          if [ "${{ steps.hubdispatch.outcome }}" = "failure" ]; then
            echo "::error::deploy-verify FAILAA — goaliq.app/ucl EI servaa repon sivuja (data on committoitu, vain sivudeploy jai valiin)"
            exit 1
          fi
