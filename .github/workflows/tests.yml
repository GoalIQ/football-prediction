# Nopea pytest-subset (ei slow-merkittyjä): WC smoke + name-aliakset +
# gate-funktiot. Toimii committoidulla datalla (wc_model.json, elo_ratings.csv,
# international_results.csv) — ei tarvitse FOOTBALL_DATA_API_KEY:tä.
# Domestic golden (@slow) ajetaan vain lokaalisti (downloaded_files gitignored).
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fast-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx
      - name: Run fast test suite
        run: pytest -m "not slow" -q

      # 28.7: em dash -portti julkaistuille sivuille + SPA-markupille. Sääntö
      # oli olemassa vain ihmisen muistissa, ja 27.7. sen ohi meni useita.
      # Ei riipu asennetuista paketeista (pelkkä stdlib), joten se ajaa myös
      # jos requirements muuttuu.
      - name: Copy style (em dash)
        run: python scripts/check_copy_style.py

      # 30.8 (Villen huomio): COPY-SYNC oli PELKKA IHMISEN KURINALAISUUS.
      # CLAUDE.md:n COPY-SYNC-GATE on ollut saanto vuodesta, mutta ainoa
      # koneellinen portti julkaistuille teksteille oli em dash yllä.
      # `check_llms_txt_sync.py` on ollut olemassa 29.8 asti eika se ajanut
      # missaan workflow'ssa, eli se suojasi vain silloin kun joku muisti
      # ajaa sen kasin. Sama vikaluokka kuin em dash -portilla 27.7.
      #
      # Portti tarkistaa kaksi asiaa:
      #   1. jokainen /fpl-sivun sisaltolohko on kuvattu llms.txt:ssa (GEO)
      #   2. syvalinkkirivin LUVUT ja Free-vaitteet vastaavat sivun lohkoa,
      #      eika rivilla ole aiemmin hylattyja sanamuotoja
      - name: Copy sync (llms.txt vs /fpl, luvut ja vaitteet)
        run: python scripts/check_llms_txt_sync.py
