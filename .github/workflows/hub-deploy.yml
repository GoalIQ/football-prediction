# goaliq.app-hubin deploy Cloudflare Pagesiin.
#
# MIKSI TAMA ON OLEMASSA (mitattu 16.8.2026):
# Hub siirrettiin 15.8 GitHub Pagesista Cloudflare Pagesiin. GH Pages
# deployasi jokaisen main-pushin itsestaan; CF Pagesin `goaliq-hub` on
# **direct upload** -projekti (Git Provider: No), eika sille jaanyt yhtaan
# deploy-polkua. Seuraus: 12 tuntia cutoverin jalkeen goaliq.app tarjoili
# yha 15.8 sisaltoa. Etusivu sanoi "149 completed matches / 53% correct"
# kun repossa oli 159 / 52,8 %.
#
# Se ei ollut kosmeettinen: julkaistu osumatarkkuus on ainoa vaite jota
# kilpailijat eivat esita, ja botti paivittaa sen joka paiva
# (`accuracy-log.yml`, `fpl-page-refresh.yml`, `render-daily-deploy`).
# Ilman tata workflow'ta jokainen niista kirjoittaa gitiin ja ei mihinkaan.
#
# 🔴 NEGATIIVINEN KONTROLLI ON PAKOLLINEN OSA. Ensimmainen kasin koottu
# tiedostolista sisalsi `pages/*.py` (Streamlit-sivut) ja
# `assets/brand/gen_classic_favicon.py`, eli lahdekoodia olisi mennyt
# julkiselle sivustolle. Portti alla kaataa ajon jos staging-hakemistoon
# paatyy lahdekoodia tai konfiguraatiota.

name: hub-deploy

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      # 16.8: ref-bridge.js. Ilman tata pelkkaa siltaa koskeva muutos ei
      # laukaisisi deployta, ja korjaus jaisi elamaan vain repoon.
      - '*.js'
      - 'fpl/**'
      # 🔴 7.9: ilman tata /ucl committoituu joka 6 h eika deployaudu
      # KERTAAKAAN. Tasan sama vika oli fpl-data-refreshissa samana
      # paivana, ja se toistettiin uudessa workflow'ssa.
      - 'ucl/**'
      - 'predictions/**'
      - 'assets/**'
      - '*.xml'
      - 'llms.txt'
      - 'robots.txt'
      - 'favicon.ico'
  workflow_dispatch: {}

concurrency:
  group: hub-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Staging kootaan gitin seuratuista tiedostoista, EI hakemistokopiona:
      # tyopuussa on venv, node_modules ja data/, ja niiden poissulkeminen
      # negatiivisella listalla on virhealtista. Positiivinen lista on se
      # mika sivustolle kuuluu.
      - name: Kokoa staging
        run: |
          set -euo pipefail
          git ls-files -z | tr '\0' '\n' \
            | grep -vE '^(src/|tests/|scripts/|notebooks/|web/|data/|outputs/|logs/|docs/|api/|supabase/|pages/|\.github/|\.devcontainer/)' \
            | grep -vE '(\.py|\.sql|\.yml|\.yaml|\.toml|\.cfg|\.ini|\.lock)$' \
            | grep -vE '^(\.gitignore|\.gitattributes|CNAME|render\.yaml|requirements.*|README.*|DEPLOY\.md|CLAUDE\.md|app\.py|config\.py|bt\.log)$' \
            > hubfiles.txt
          mkdir -p _hub
          while IFS= read -r f; do
            mkdir -p "_hub/$(dirname "$f")"
            cp "$f" "_hub/$f"
          done < hubfiles.txt
          echo "staging: $(find _hub -type f | wc -l) tiedostoa"

      # Portti 1: julkiselle sivustolle ei saa paatya lahdekoodia.
      - name: Portti - ei lahdekoodia stagingissa
        run: |
          set -euo pipefail
          FOUND=$(find _hub -type f \( -name '*.py' -o -name '*.sql' -o -name '*.ts' \
            -o -name '*.yml' -o -name '*.yaml' -o -name '*.env*' -o -name '*.toml' \) | head -20)
          if [ -n "$FOUND" ]; then
            echo "::error::Lahdekoodia stagingissa:"; echo "$FOUND"; exit 1
          fi
          echo "OK: ei lahdekoodia"

      # Portti 2: jokainen sitemapissa luvattu URL on olemassa. Tama on se
      # portti joka olisi napannut vajaan latauksen ennen kuin kayttaja
      # nakee 404:n.
      - name: Portti - sitemapin URLit ovat olemassa
        run: |
          python3 - <<'PY'
          import glob, os, re, sys
          urls = set()
          for sm in glob.glob('_hub/sitemap*.xml'):
              urls |= set(re.findall(r'<loc>https://goaliq\.app/([^<]*)</loc>',
                                     open(sm, encoding='utf-8').read()))
          missing = []
          for u in sorted(urls):
              if not u or u.endswith('.xml'):
                  continue
              p = os.path.join('_hub', u)
              if os.path.exists(p) or os.path.exists(p + '.html'):
                  continue
              missing.append(u)
          print(f'sitemap-URLeja {len(urls)}, puuttuu {len(missing)}')
          if missing:
              print('\n'.join(missing[:20]))
              sys.exit(1)
          PY

      - name: Deploy Cloudflare Pagesiin
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _hub --project-name=goaliq-hub --branch=main --commit-dirty=true

      # Portti 3: verifioi TUOTANNOSTA eika deployn statuksesta. Vihrea
      # deploy ei todista etta domain tarjoilee uuden sisallon; CF:n
      # propagaatio on mitattu minuuteissa, ja cutover-paivana ensimmaiset
      # ~3 min palauttivat 522.
      - name: Verifioi domainilta
        run: |
          set -euo pipefail
          EXPECT=$(grep -oE '<b>[0-9]+ completed matches</b>' index.html | head -1)
          echo "odotetaan: $EXPECT"
          for i in $(seq 1 20); do
            LIVE=$(curl -sS --max-time 20 https://goaliq.app/ | grep -oE '<b>[0-9]+ completed matches</b>' | head -1 || true)
            if [ "$LIVE" = "$EXPECT" ]; then echo "OK ($i. yritys): $LIVE"; exit 0; fi
            echo "$i: live=$LIVE, odotetaan 15 s"; sleep 15
          done
          echo "::error::goaliq.app ei tarjoile uutta sisaltoa 5 min jalkeen"; exit 1

      # Portti 4: KORTIN LUPAAMA TARKISTUSREITTI VASTAA TUOTANNOSSA.
      #
      # Tuloskortti on pysyva kuva jonka alatunniste lupaa
      # `goaliq.app/fpl/points/gw{n}`. Ennen 7.9.2026 se lupasi paljaan
      # `/fpl/points`in, joka nayttaa vain kuluvan kierroksen: GW2:n kortti
      # lahetti lukijan sivulle jolla oli GW3:n luvut. Offline-portti
      # (tests/test_card_route_resolves.py) mittaa etta TIEDOSTO on olemassa,
      # tama mittaa etta DOMAIN tarjoilee sen.
      #
      # 🔴 STATUSKOODI EI RIITA. goaliq.app ei palauta 404:aa kaikilla
      # poluilla (muisti: goaliq-app-ei-palauta-404), joten 200 voi olla
      # fallback-sivu. Siksi vaaditaan lisaksi etta sivun canonical osoittaa
      # TAHAN URLiin - sita mikaan muu sivu ei voi vaittaa.
      #
      # 🔴 NEGATIIVINEN KONTROLLI: /fpl/points/gw99 ei ole pelattu kierros.
      # Ilman sita portti lapaisisi myos silloin kun palvelin tarjoilee minka
      # tahansa polun samana sivuna, eli mittaisi tyhjaa.
      - name: Portti - kortin reitti vastaa tuotannossa
        run: |
          python3 - <<'PY'
          import glob, os, subprocess, sys, time

          def hae(url):
              body = subprocess.run(
                  ["curl", "-sS", "-L", "--max-time", "20", url],
                  capture_output=True).stdout.decode("utf-8", "replace")
              koodi = subprocess.run(
                  ["curl", "-sS", "-L", "-o", os.devnull, "-w", "%{http_code}",
                   "--max-time", "20", url],
                  capture_output=True).stdout.decode().strip()
              return koodi, body

          def oma_canonical(body, url):
              return '<link rel="canonical" href="' + url + '"' in body

          gws = sorted(os.path.basename(f)[:-5]
                       for f in glob.glob("fpl/points/gw*.html"))
          if not gws:
              print("::error::arkistosivuja ei ole - kortin reitti ei vastaa")
              sys.exit(1)
          print("tarkistetaan:", " ".join(gws))
          for gw in gws:
              url = "https://goaliq.app/fpl/points/" + gw
              for i in range(1, 13):
                  koodi, body = hae(url)
                  if koodi == "200" and oma_canonical(body, url):
                      print("OK", url)
                      break
                  print(gw + ": " + str(i) + ". yritys (code=" + koodi
                        + "), odotetaan 15 s")
                  time.sleep(15)
              else:
                  print("::error::" + url + " ei vastaa omalla canonicalillaan")
                  sys.exit(1)

          neg = "https://goaliq.app/fpl/points/gw99"
          _, body = hae(neg)
          if oma_canonical(body, neg):
              print("::error::" + neg + " nayttaa arkistosivulta - portti "
                    "lapaisi tyhjana")
              sys.exit(1)
          print("OK negatiivinen kontrolli: gw99 ei ole sivu")
          PY
