<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- SEO-404-FALLBACK (2026-08-20): the existence of this file turns off
       the CF Pages SPA fallback. Pages only serves index.html with 200 for
       unknown paths when 404.html is missing. noindex so the error page
       itself stays out of the index. -->
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/goaliq-favicon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#0B0A09">
  <title>Page not found | GoalIQ</title>
  <style>
    :root {
      --ink: #F3F2F2; --cream: #0B0A09; --card: #141311;
      --line: rgba(243,242,242,0.24); --muted: #A8A29A;
      --teal: #2ED6C2; --amber: #F5C542;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--cream); color: var(--ink);
      font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      line-height: 1.6; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    main { max-width: 560px; }
    h1 { font-size: 1.6rem; margin: 0 0 12px; }
    .code { color: var(--amber); }
    p { color: var(--muted); margin: 0 0 20px; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { border-top: 1px solid var(--line); }
    li:last-child { border-bottom: 1px solid var(--line); }
    a { color: var(--teal); text-decoration: none; display: block; padding: 10px 4px; }
    a:hover { text-decoration: underline; }
  
/* --- 4 Sep 2026: two typefaces, one job each ------------------------------
   Mono is right for numbers: it keeps columns straight and digits
   comparable, and it is what the brand is recognised by. It is wrong for
   prose, because it was designed for code, so words do not form
   recognisable shapes and reading slows down. Measured before this change:
   a single typeface across 2,559 words of body copy on the landing page,
   nine different body sizes including 13.6px, and lines up to 125
   characters where 45-75 is the readable range. Sans is the sibling of the
   same family, so the pairing does not fight the brand and adds no new
   loading origin. */
:root{--mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;}
body{font-family:var(--sans);font-size:16px;line-height:1.65;}
h1,h2,h3,h4,.brand,.logo,.btn,.nav-cta,.bar,.ticker,.record-chip,.stat b,
table,th,td,.num,.pick,.tflag,code,kbd,.mono,.tag,.chip,
.toolnav,.clubnav,.share,.lbctl,.lb{font-family:var(--mono);}
/* Reading measure: prose only, never a table, so no column is squeezed. */
p,.lede,.hint,.note,.fineprint,li{max-width:68ch;}
td p,th p,table p,td li,table li{max-width:none;}
/* Touch targets. Apple asks 44px, Google 48dp. Measured at 390px wide
   before this change: 34 links and buttons under 32px tall, on the device
   FPL is actually played on. Height comes from padding, so nothing moves. */
@media (hover:none){
  nav a,footer a,.toolnav a,.clubnav a,.share a,.navgrp a,.rec a,.link-row a{
    display:inline-flex;align-items:center;min-height:44px;}
}
</style>
</head>
<body>
  <main>
    <h1><span class="code">404</span> Page not found</h1>
    <p>Match prediction pages come down once the match kicks off, so an old
    link may have expired. The prediction itself stays in the public record.</p>
    <ul>
      <li><a href="/predictions">Match predictions and the public track record</a></li>
      <li><a href="/fpl">FPL tools: clean sheet probability and fixture difficulty</a></li>
      <li><a href="/">GoalIQ front page</a></li>
    </ul>
  </main>
<!-- Ref bridge here too: a creator link can point at an expired match page,
     and without the bridge attribution would break in exactly the case
     this page exists for. -->
<script defer src="/ref-bridge.js"></script>
</body>
</html>
